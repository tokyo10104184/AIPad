<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo Pad</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="main-content-container"> <!-- New wrapper for main scrollable content -->
        <div id="app-container">
            <h1>Memo Pad</h1>
            <div id="input-area">
                <input type="text" id="memo-title" placeholder="Memo Title">
                <textarea id="memo-content" placeholder="Memo Content"></textarea>
            </div>
            <div id="button-area">
                <button id="create-btn">Create Memo</button>
                <button id="save-btn" style="display:none;">Save Memo</button>
                <button id="delete-btn" style="display:none;">Delete Memo</button>
            </div>
            <div id="memos-list">
                <!-- Memos will be displayed here -->
            </div>
        </div> <!-- End of app-container -->
    </div> <!-- End of main-content-container -->

    <div id="sticky-ai-chat-container"> <!-- New dedicated container for AI chat -->
        <!-- <h2 id="ai-chat-title">AI Assistant</h2> --> <!-- Commented out or removed -->
        <div id="ai-question-area">
            <input type="text" id="ai-question-input" placeholder="Ask the AI about your memos...">
            <button id="ai-ask-btn">↑</button> <!-- Changed text to arrow -->
        </div>
    </div>

    <script src="src/app.js"></script>

    <!-- Full-Screen Chat View (Initially Hidden) -->
    <div id="fullscreen-chat-view" style="display: none;">
        <div id="fullscreen-chat-header">
            <h2 id="fullscreen-chat-title">AI Conversation</h2> <!-- Title for the modal -->
            <button id="close-chat-btn">&times;</button> <!-- Close button (X icon) -->
        </div>
        <div id="chat-messages-container">
            <!-- Messages will be appended here by JavaScript -->
        </div>
        <div id="fullscreen-chat-input-area">
            <input type="text" id="fullscreen-chat-input">
            <button id="fullscreen-send-btn">↑</button> <!-- Send button (Arrow icon) -->
        </div>
    </div>
</body>
</html>
