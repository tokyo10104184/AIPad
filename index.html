<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo Pad</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <h1>Memo Pad</h1>
        <div id="input-area">
            <input type="text" id="memo-title" placeholder="Memo Title">
            <textarea id="memo-content" placeholder="Memo Content"></textarea>
        </div>
        <div id="button-area">
            <button id="create-btn">Create Memo</button>
            <button id="save-btn" style="display:none;">Save Memo</button>
            <button id="delete-btn" style="display:none;">Delete Memo</button>
        </div>
        <div id="memos-list">
            <!-- Memos will be displayed here -->
        </div>

        <hr> <!-- Optional: a separator -->

        <div id="ai-chat-area">
            <h2 id="ai-chat-title">AI Assistant</h2> <!-- Title for the AI section -->
            <div id="ai-question-area">
                <input type="text" id="ai-question-input" placeholder="Ask the AI about your memos...">
                <button id="ai-ask-btn">Ask AI</button>
            </div>
            <div id="ai-response-area">
                <p id="ai-response-placeholder">AI response will appear here.</p>
                <!-- AI's actual response will be injected here by JS -->
            </div>
        </div>
    </div> <!-- Closing app-container -->
    <script src="src/app.js"></script>
</body>
</html>
